version: '3.8'

services: 
  db: 
    image: mysql:8
    container_name: mysql-db
    restart: unless-stopped
    networks:
      inner_net:
        ipv4_address: 192.168.20.2
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports: 
      - "${DB_PORT_EXTERNAL}:3306"
    volumes:
      - volBank:/var/lib/mysql
      - ./src/main/webapp/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tunnel
    restart: unless-stopped
    networks:
      extra_net:
        ipv4_address: 192.168.30.3
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run

  app:
    build: .
    image: stockmei
    container_name: app-stockmei
    restart: unless-stopped
    networks:
      inner_net:
        ipv4_address: 192.168.20.3
      extra_net:
        ipv4_address: 192.168.30.2
    ports: 
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PASSDEFAULT=${DB_PASSDEFAULT}

networks:
  inner_net:
    name: interna
    driver: bridge
    labels:
      com.example.description: "Rede entre o banco e o app"
      com.example.department: "interno"
    ipam:
      config:
        - subnet: 192.168.20.0/29 
          gateway: 192.168.20.6

  extra_net:
    name: externa
    driver: bridge
    labels:
      com.example.description: "Rede para internet externo com o cloudflare"
      com.example.department: "externo"
    ipam:
      config:
        - subnet: 192.168.30.0/29  
          gateway: 192.168.30.6

volumes:
  volBank: